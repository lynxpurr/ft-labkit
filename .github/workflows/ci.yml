name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, edited, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # 版本钉死：ruff 的缺省规则集随版本变化，不钉则新规则会让 CI 无故变红
      - name: ruff (pinned)
        run: |
          python -m pip install "ruff==0.17.6"
          ruff check labkit tests tools

  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests (source tree)
        run: python -m unittest discover -s tests -t . -v
      # 同一套测试再对"已安装的包"跑一遍：模板必须随 wheel 走，就是靠这一遍钉住的
      - name: Unit tests against the installed package
        run: |
          python -m pip install .
          rm -rf "$RUNNER_TEMP/installed" && mkdir -p "$RUNNER_TEMP/installed"
          cp -r tests "$RUNNER_TEMP/installed/tests"
          cd "$RUNNER_TEMP/installed"
          python -m unittest discover -s tests -t . -v

  packages:
    name: release packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # 从确切的提交构建 sdist 与 wheel，逐项对照发布清单核对，落 SHA256SUMS
      - name: Build from the exact commit and verify against the file inventory
        run: |
          python -m pip install "build>=1.2,<2"
          python tools/verify_dist.py dist
      # 检查器自己也要被检查：用另一套实现对工具写出的 SHA256SUMS 做独立复核
      - name: Independently re-check the written checksums
        run: |
          cd dist
          sha256sum -c SHA256SUMS
          test "$(wc -l < SHA256SUMS)" -eq 2
      - name: Install the verified wheel in a clean environment and use it
        run: |
          python -m venv "$RUNNER_TEMP/clean"
          "$RUNNER_TEMP/clean/bin/pip" install dist/*.whl
          cd "$(mktemp -d)"
          "$RUNNER_TEMP/clean/bin/labkit" new demo-lab
          test -f demo-lab/PLAN.md
          test -f demo-lab/.gitignore
          test -f demo-lab/.agents/skills/demo-lab/SKILL.md
          "$RUNNER_TEMP/clean/bin/labkit" --version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
