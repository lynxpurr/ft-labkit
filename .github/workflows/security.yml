name: dependency-advisories

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, edited, ready_for_review]
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  audit:
    name: known advisories for resolved dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # v0 零运行时依赖，解析结果为空；这条工作流是为将来引入依赖时准备的常设检查
      - name: Install project dependencies and audit tooling
        run: |
          python -m pip install . "pip-audit>=2.9,<3"
          python -m pip freeze --exclude ft-labkit --exclude pip-audit > audit-requirements.txt
      - name: Query known dependency advisories
        run: python -m pip_audit -r audit-requirements.txt --no-deps --disable-pip
